<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">雨夜书店咖啡馆的电影剧照</title>
  <desc id="desc">暖色咖啡馆内，两个人隔桌交谈，窗外是雨夜街灯和旧书店。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132c2d"/>
      <stop offset=".58" stop-color="#20423d"/>
      <stop offset="1" stop-color="#0c1d1f"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183a46"/>
      <stop offset=".45" stop-color="#547473"/>
      <stop offset="1" stop-color="#c5825b"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aa6e45"/>
      <stop offset="1" stop-color="#4c2d23"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffe3aa" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#e7a152" stop-opacity=".45"/>
      <stop offset="1" stop-color="#d0783c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceLight" cx=".3" cy=".3" r=".8">
      <stop offset="0" stop-color="#d89068"/>
      <stop offset="1" stop-color="#58352e"/>
    </radialGradient>
    <filter id="blur18">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur5">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="9" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono">
        <feFuncA type="table" tableValues="0 .16"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <clipPath id="windowClip">
      <rect x="70" y="60" width="820" height="720" rx="10"/>
    </clipPath>
  </defs>

